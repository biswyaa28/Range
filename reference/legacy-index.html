  }
}

/* ---- keyboard: [ ] prev/next · d/w/m view · t today · arrows move a
   focused block 15 min · Enter edits (n is the global new-chord prefix;
   bare n in Plan still opens the block form via the chord timeout) ---- */
function refocusBlk(id) { const el = $('.cal-blk[data-id="' + id + '"]'); if (el) el.focus(); }
document.addEventListener('keydown', e => {
  if (route !== 'timetable') return;
  if (P.open || modalOpen()) return;
  if (e.key === 'Escape') {
    if (CALDOWN || CALDRAG) { e.preventDefault(); calDragCancel(); return; }
    if (CALPOP) { e.preventDefault(); closeCalPop(); return; }
    return;
  }
  const typing = e.target.matches && e.target.matches('input, textarea, select');
  if (typing) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const blkEl = !typing && e.target.closest && e.target.closest('.cal-blk');
  if (blkEl && CAL.mode !== 'month') {
    const b = state.blocks.find(x => x.id === blkEl.dataset.id);
    if (!b) return;
    const iso = blkEl.dataset.iso;
    const grid = calCurGrid();
    if (e.key === 'Enter') { e.preventDefault(); openBlockModal(b); return; }
    if (e.key === ' ') { e.preventDefault(); openBlockPop(b, iso, blkEl); return; }
    let delta = 0, dayShift = 0;
    if (e.key === 'ArrowUp') delta = -15;
    else if (e.key === 'ArrowDown') delta = 15;
    else if (e.key === 'ArrowLeft') { if (CAL.mode === 'week') dayShift = -1; else delta = -15; }
    else if (e.key === 'ArrowRight') { if (CAL.mode === 'week') dayShift = 1; else delta = 15; }
    else return;
    e.preventDefault();
    const dur = hmToMin(b.end) - hmToMin(b.start);
    if (delta) {
      const ns = clamp(hmToMin(b.start) + delta, grid.s, Math.max(grid.s, grid.e - dur));
      b.start = fmtHM(ns); b.end = fmtHM(ns + dur);
      touchRec(b);
      recomputeDayStats(todayISO()); Store.set(); renderView();
      refocusBlk(b.id);
      liveSay(b.title + ' moved to ' + b.start);
    } else if (dayShift) {
      const niso = addDays(iso, dayShift);
      b.day = typeof b.day === 'string' ? niso : mondayIndex(fromISO(niso));
      if (CAL.mode === 'day') CAL.anchor = niso;
      touchRec(b);
      recomputeDayStats(todayISO()); Store.set(); renderView();
      refocusBlk(b.id);
      liveSay(b.title + ' moved to ' + (typeof b.day === 'string' ? fmtShort(b.day) : DAY_FULL[b.day]));
    }
    return;
  }
  const k = e.key.toLowerCase();
  if (k === '[') { e.preventDefault(); calGo(-1); }
  else if (k === ']') { e.preventDefault(); calGo(1); }
  else if (k === 'd' || k === 'w' || k === 'm') { e.preventDefault(); calSetMode({ d: 'day', w: 'week', m: 'month' }[k]); }
  else if (k === 't') { e.preventDefault(); calToday(); }
});

/* ---- live NOW line (transform-positioned; checked every 20 s) ---- */
function calNowPaint() {
  $$('.cal-now').forEach(el => {
    const canvas = el.parentElement;
    if (!canvas || !canvas.dataset.s) return;
    const s = +canvas.dataset.s, e2 = +canvas.dataset.e;
    const n = new Date();
    const m = n.getHours() * 60 + n.getMinutes();
    if (m < s || m >= e2) { el.classList.remove('vis'); return; }
    el.style.transform = 'translateY(' + ((m - s) / (e2 - s) * canvas.clientHeight).toFixed(1) + 'px)';
    el.classList.add('vis');
    const b = $('b', el); if (b) b.textContent = nowHM();
  });
}
setInterval(() => { if (route === 'timetable') calNowPaint(); }, 20000);

/* ---------------- 13. VIEW: TO-DO ---------------- */
let TODO_FILTER = 'all';
function todoFiltered() {
  const T = todayISO();
  return liveArr(state.tasks).filter(t => {
    if (TODO_FILTER === 'done') return !!t.done;
    if (TODO_FILTER === 'today') return !t.done && t.due === T;
    if (TODO_FILTER === 'overdue') return !t.done && !!t.due && t.due < T;
    return true; /* all */

}

  else if (d < 0) { label = 'Overdue ' + (-d) + 'd'; cls = ' red'; }
  else if (d === 0) { label = 'Today'; cls = ' solid'; }
  else if (d === 1) { label = 'Tomorrow'; cls = ''; }
  else { label = d + 'd · ' + fmtShort(t.due); cls = ''; }

}

    '</select></div>',

    '</form>',

      '<button' + (TODO_FILTER === k ? ' class="active"' : '') + ' data-action="todo-filter" data-f="' + k + '">' + l + ' · ' + counts[k] + '</button>'

  if (list.length) {

      const p = prioInfo(t.priority);

/* ---------------- 17. VIEW: STATS (hand-drawn SVG charts) ---------------- */
let statRange = 'week';
function weekDays() {
  const mon = addDays(todayISO(), -mondayIndex());
  return Array.from({ length: 7 }, (_, i) => addDays(mon, i));
}
function lastNDays(n) {
  return Array.from({ length: n }, (_, i) => addDays(todayISO(), -(n - 1 - i)));
}
/* Days with <80% completion break the chain; days without data are skipped. */
function currentStreak() {
  let streak = 0;
  let iso = todayISO();
  for (let i = 0; i < 400; i++) {
    const s = state.dayStats[iso];
    if (s && s.blocksTotal > 0) {
      if (s.blocksDone / s.blocksTotal >= 0.8) streak++;
      else if (iso !== todayISO()) break;   /* an in-progress today never breaks it */
    }
    iso = addDays(iso, -1);
  }
  return streak;
}
function niceCeil(v) {
  if (v <= 5) return 5;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const c = [1, 2, 5, 10];
  for (let i = 0; i < c.length; i++) if (c[i] * p >= v) return c[i] * p;
  return 10 * p;
}
function chartSVG(items, color, ariaLabel) {
  const n = items.length;
  const W = Math.max(560, n * 38 + 70), H = 240;
  const padL = 48, padR = 16, padT = 28, padB = 42;
  const iw = W - padL - padR, ih = H - padT - padB;
  const maxV = Math.max(1, ...items.map(x => x.value));
  const nice = niceCeil(maxV);
  const colW = iw / n, barW = Math.min(24, colW - 10);
  const lblEvery = n <= 8 ? 1 : Math.ceil(n / 8);
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(ariaLabel) + '">';
  [0, nice / 2, nice].forEach(v => {
    const y = padT + ih - (v / nice) * ih;
    s += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '" style="stroke:var(--border)" stroke-width="' + (v === 0 ? 1.5 : 1) + '"' + (v > 0 ? ' stroke-dasharray="3 6" opacity=".7"' : '') + '/>';
    s += '<text x="' + (padL - 7) + '" y="' + (y + 4) + '" text-anchor="end" font-size="10.5" style="fill:var(--text-2)">' + Number(v.toFixed(1)) + '</text>';
  });
  items.forEach((it, i) => {
    const h = (it.value / nice) * ih;
    const x = padL + i * colW + (colW - barW) / 2;
    const y = padT + ih - h;
    const stub = it.value > 0 ? 0 : 3;
    s += '<rect class="cbar" style="--i:' + i + ';fill:' + color + (it.value > 0 ? '' : ';opacity:.35') + '" x="' + x.toFixed(1) + '" y="' + (y - stub).toFixed(1) + '" width="' + barW + '" height="' + Math.max(stub, h).toFixed(1) + '" rx="4">' +
      (it.value > 0 ? '<title>' + esc(it.label) + ': ' + it.value + '</title>' : '') + '</rect>';
    if (it.value > 0 && (n <= 10 || i % lblEvery === 0 || it.value === maxV)) {
      s += '<text x="' + (x + barW / 2).toFixed(1) + '" y="' + (y - 6).toFixed(1) + '" text-anchor="middle" font-size="10" style="fill:var(--text)">' + it.value + '</text>';
    }
    if (i % lblEvery === 0) {
      s += '<text x="' + (x + barW / 2).toFixed(1) + '" y="' + (H - 18) + '" text-anchor="middle" font-size="9.5" style="fill:var(--text-2)">' + esc(it.label) + '</text>';
    }
  });
  s += '</svg>';
  return s;
}
function renderStats() {
  const days = statRange === 'week' ? weekDays() : lastNDays(30);
  const stats = days.map(iso => statsFor(iso));
  const withBlocks = stats.filter(s => s.blocksTotal > 0);
  const totB = sum(withBlocks, s => s.blocksTotal);
  const doneB = sum(withBlocks, s => s.blocksDone);
  const rate = totB ? Math.round((doneB / totB) * 100) : null;
  const totTasks = sum(stats, s => s.tasksDone);
  const totFocus = sum(stats, s => s.focusMinutes);
  const active = stats.filter(s => s.blocksTotal > 0 || s.tasksDone > 0 || s.focusMinutes > 0).length || 1;
  const streak = currentStreak();
  const lbl = iso => statRange === 'week' ? DAY_SHORT[mondayIndex(fromISO(iso))] : (fromISO(iso).getMonth() + 1) + '/' + fromISO(iso).getDate();
  const parts = [];
  parts.push(
    '<div class="view-head"><h1>Stats</h1><div class="rule"></div></div>',
    '<div class="row" style="margin-bottom:18px">',
    '<div class="seg" data-seg="range">',
    '<button data-action="stat-range" data-r="week"' + (statRange === 'week' ? ' class="active"' : '') + '>This week</button>',
    '<button data-action="stat-range" data-r="30d"' + (statRange === '30d' ? ' class="active"' : '') + '>Last 30 days</button>',
    '</div></div>',
    '<div class="stats-cards">',
    '<div class="stat-card"><div class="stat-label">Block completion</div><div class="stat-big"' + (rate === null ? '' : ' data-count="' + rate + '" data-suffix="%" data-ck="s-rate"') + '>' + (rate === null ? '—' : rate + '%') + '</div>',
    '<div class="mini-bar"><i style="transform:scaleX(' + ((rate || 0) / 100).toFixed(3) + ')"></i></div>',
    '<div class="stat-sub">' + (totB ? doneB + ' of ' + totB + ' blocks' : 'No data yet') + '</div></div>',
    '<div class="stat-card"><div class="stat-label">' + ICON.check + ' Tasks done</div><div class="stat-big" data-count="' + totTasks + '" data-ck="s-tasks">' + totTasks + '</div><div class="stat-sub">Avg ' + (totTasks / active).toFixed(1) + ' / active day</div></div>',
    '<div class="stat-card"><div class="stat-label">' + ICON.bolt + ' Current streak</div><div class="stat-big" data-count="' + streak + '" data-ck="s-streak">' + streak + '</div><div class="stat-sub">Days with ≥80% blocks done</div></div>',
    '<div class="stat-card"><div class="stat-label">' + ICON.timer + ' Focus time</div><div class="stat-big" data-count="' + totFocus + '" data-ck="s-focus">' + totFocus + '</div><div class="stat-sub">Minutes · avg ' + (totFocus / active).toFixed(0) + ' / active day</div></div>',
    '</div>',
    '<div class="panel chart-card"><div class="panel-head"><h2>Tasks done per day</h2><span class="chip">Σ ' + totTasks + '</span></div>' +
    chartSVG(days.map((iso, i) => ({ label: lbl(iso), value: stats[i].tasksDone })), 'var(--chart-bar)', 'Tasks done per day bar chart') + '</div>',
    '<div class="panel chart-card"><div class="panel-head"><h2>Focus minutes per day</h2><span class="chip">Σ ' + totFocus + ' min</span></div>' +
    chartSVG(days.map((iso, i) => ({ label: lbl(iso), value: stats[i].focusMinutes })), 'var(--chart-bar)', 'Focus minutes per day bar chart') + '</div>',
    '<div class="panel health-card">',
    ICON.heart,
    '<div><h2 style="font-size:17px;font-weight:600">Health <span class="chip">Coming soon</span></h2>',
    '<p class="hint">Steps and sleep will land here once you connect a tracker. This card is a reserved slot — no data leaves this file.</p></div>',
    '</div>'
  );
  return parts.join('');
}

/* ════════════════════════════════════════════════════════════════
   21.5 VISUAL LAYER (Apple × Google restyle — presentation only)
   Entrance stagger · scroll-reveal · count-ups · segmented-control
   indicators · View-Transition section switching · today now-line ·
   theme "auto" (follows prefers-color-scheme) · timer cross-fade.
   Nothing in this section reads or writes app state shapes.
   ════════════════════════════════════════════════════════════════ */
const RM_MQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
function prefersReduced() { return !!(RM_MQ && RM_MQ.matches); }
let vtBooted = false;
setTimeout(() => { vtBooted = true; }, 80);
let lastTaskToggled = null;

/* ---- theme: 'auto' follows the system, manual light/dark wins ---- */
function resolvedTheme() {
  const t = state ? state.settings.theme : 'auto';
  if (t === 'auto') return (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  return t;
}
if (window.matchMedia) {
  const schemeMQ = matchMedia('(prefers-color-scheme: dark)');
  const onScheme = () => { if (state && state.settings.theme === 'auto') applyTheme(); };
  if (schemeMQ.addEventListener) schemeMQ.addEventListener('change', onScheme);
  else if (schemeMQ.addListener) schemeMQ.addListener(onScheme);
}

/* ---- iOS segmented controls: sliding spring indicator ---- */
const segPrev = {};
function initSegs(root) {
  $$('.seg[data-seg]', root || document).forEach(seg => {
    const btns = $$('button', seg);
    const act = btns.findIndex(b => b.classList.contains('active'));
    if (act < 0) return;
    let ind = $('.seg-ind', seg);
    if (!ind) { ind = document.createElement('span'); ind.className = 'seg-ind'; seg.appendChild(ind); }
    const key = seg.dataset.seg;
    const prev = segPrev[key];
    const place = (i, anim) => {
      const b = btns[i]; if (!b) return;
      ind.style.transition = anim ? '' : 'none';
      ind.style.width = b.offsetWidth + 'px';
      ind.style.transform = 'translateX(' + b.offsetLeft + 'px)';
    };
    if (prev != null && prev !== act && btns[prev] && !prefersReduced()) {
      place(prev, false);
      requestAnimationFrame(() => requestAnimationFrame(() => place(act, true)));
    } else {
      place(act, false);
    }
    segPrev[key] = act;
  });
}

/* ---- per-render presentation pass (called from renderView) ---- */
const ENTRANCE_SEL = '.view-head, #view .panel, #view > .todo-filters, .timeline > .block, #view > .task, .dl-card, .note-item, .stat-card, .week-grid > .day-col, .oneoff-row, #view > .fab, #view > .empty';
let lastVRoute = null;
const cntPrev = {}, pctPrev = {};
function animateEntrance(main) {
  const fresh = route !== lastVRoute;
  lastVRoute = route;
  /* same-view re-renders stay calm: no replay of mount animations */
  document.body.classList.toggle('fx-calm', !fresh);
  const v = $('#view');
  if (v) v.classList.toggle('scrolled-hero', (window.scrollY || 0) > 90);

  /* replay completion animation on the just-toggled task (blocks use .pop in renderView) */
  if (lastTaskToggled && route === 'todo') {
    const tb = $('.tickbox[data-id="' + lastTaskToggled + '"]');
    const el = tb ? tb.closest('.task') : null;
    if (el) { el.classList.add('pop'); setTimeout(() => el.classList.remove('pop'), 550); }
    lastTaskToggled = null;
  }

  initSegs(main);

  /* number count-ups, easing from the previous value across re-renders */
  $$('[data-count]', main).forEach(el => {
    const target = parseFloat(el.getAttribute('data-count'));
    if (!isFinite(target)) return;
    const key = el.getAttribute('data-ck');
    const from = key && isFinite(cntPrev[key]) ? cntPrev[key] : 0;
    if (key) cntPrev[key] = target;
    const suffix = el.getAttribute('data-suffix') || '';
    if (prefersReduced() || from === target) { el.textContent = target + suffix; return; }
    const t0 = performance.now(), dur = 550;
    (function step(now) {
      const p = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(from + (target - from) * e) + suffix;
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  });

  /* progress bars sweep in from their previous value (scaleX, never width) */
  const pb = $('.pbar-fill', main);
  if (pb) {
    const target = parseFloat((pb.style.transform || '').replace(/[^0-9.]/g, '')) || 0;
    const from = isFinite(pctPrev.today) ? pctPrev.today : 0;
    pctPrev.today = target;
    if (!prefersReduced() && from !== target) {
      pb.style.transition = 'none'; pb.style.transform = 'scaleX(' + from + ')';
      requestAnimationFrame(() => requestAnimationFrame(() => { pb.style.transition = ''; pb.style.transform = 'scaleX(' + target + ')'; }));
    }
  }
  $$('.mini-bar i', main).forEach(el => {
    const m = /scaleX\(([0-9.]*)\)/.exec(el.style.transform || '');
    const target = m ? parseFloat(m[1]) : 0;
    if (prefersReduced() || !target) return;
    el.style.transition = 'none'; el.style.transform = 'scaleX(0)';
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.transition = ''; el.style.transform = 'scaleX(' + target + ')'; }));
  });

  if (!fresh || prefersReduced()) return;

  /* staggered entrance for items already in view; reveal the rest on scroll (once) */
  const items = $$(ENTRANCE_SEL, main);
  let io = null;
  if ('IntersectionObserver' in window) {
    io = new IntersectionObserver(ents => ents.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add('fx-in'); io.unobserve(en.target); }
    }), { threshold: 0.12 });
  }
  let n = 0;
  items.forEach(el => {
    if (io && el.getBoundingClientRect().top > window.innerHeight - 24) { io.observe(el); return; }
    el.style.animationDelay = Math.min(n++, 12) * 30 + 'ms';
    el.classList.add('fx-in');
  });
}

/* ---- timer digits cross-fade (wraps paint purely to replay a CSS class) ---- */
(function () {
  const orig = Pomo.paint.bind(Pomo);
  Pomo.paint = function () {
    const el = $('#pomo-time');
    const before = el ? el.textContent : null;
    orig();
    if (el && el.textContent !== before && !prefersReduced()) {
      el.classList.remove('tickfade');
      void el.offsetWidth;
      el.classList.add('tickfade');
    }
  };
})();

/* ---- today: thin "now" line + auto-scroll to the current block ---- */
let nowTimer = 0, didAutoScroll = false;
function visHmMin(hm) { return parseInt(hm.slice(0, 2), 10) * 60 + parseInt(hm.slice(3, 5), 10); }
MOUNTS.today = function () {
  const tl = $('.timeline');
  if (!tl) return;
  const line = document.createElement('div');
  line.className = 'now-line';
  line.setAttribute('aria-hidden', 'true');
  line.innerHTML = '<span class="now-time"></span>';
  tl.appendChild(line);
  const blocks = $$('.block', tl);
  const place = () => {
    if (!document.body.contains(line)) { clearInterval(nowTimer); return; }
    const now = nowHM();
    const cur = blocks.find(el => el.dataset.start <= now && now < el.dataset.end);
    let y = null;
    if (cur) {
      const sh = visHmMin(cur.dataset.start), eh = visHmMin(cur.dataset.end);
      y = cur.offsetTop + cur.offsetHeight * ((visHmMin(now) - sh) / Math.max(1, eh - sh));
    } else {
      let prev = null, next = null;
      blocks.forEach(el => { if (el.dataset.end <= now) prev = el; if (!next && el.dataset.start > now) next = el; });
      if (prev && next) {
        const pb = prev.offsetTop + prev.offsetHeight, nt = next.offsetTop;
        y = pb + (nt - pb) * ((visHmMin(now) - visHmMin(prev.dataset.end)) / Math.max(1, visHmMin(next.dataset.start) - visHmMin(prev.dataset.end)));
      }
    }
    line.classList.toggle('vis', y != null);
    if (y != null) { line.style.transform = 'translateY(' + y + 'px)'; $('.now-time', line).textContent = now; }
  };
  place();
  clearInterval(nowTimer);
  nowTimer = setInterval(place, 15000);
  if (!didAutoScroll) {
    didAutoScroll = true;
    const target = blocks.find(el => el.classList.contains('now')) || blocks.find(el => el.dataset.start > nowHM()) || blocks[blocks.length - 1];
    if (target) setTimeout(() => { try { target.scrollIntoView({ behavior: prefersReduced() ? 'auto' : 'smooth', block: 'center' }); } catch (e) {} }, 500);
  }
};

/* ---- large-title collapse + hero shrink + nav auto-hide + progress line ---- */
let scrollRaf = 0, navLastY = 0, navAway = false;
function scrollChrome(y) {
  document.body.classList.toggle('scrolled', y > 56);
  const v = $('#view');
  if (v) v.classList.toggle('scrolled-hero', y > 90);
  /* top nav slides up while scrolling down, returns on the way back up */
  const dy = y - navLastY;
  navLastY = y;
  if (!navAway && y > 120 && dy > 3) { navAway = true; document.body.classList.add('nav-away'); }
  else if (navAway && (dy < -3 || y <= 120)) { navAway = false; document.body.classList.remove('nav-away'); }
  /* 2 px reading-progress line on long lists (Tasks, Notes) */
  const sl = $('#scrollline');
  if (sl) {
    const long = route === 'todo' || route === 'notes';
    const max = long ? (document.documentElement.scrollHeight - window.innerHeight) : 0;
    if (long && max > 40) {
      sl.classList.add('on');
      sl.style.transform = 'scaleX(' + Math.min(1, Math.max(0.004, y / max)).toFixed(4) + ')';
    } else sl.classList.remove('on');
  }
  /* small title fades into the blurred bar once the large one scrolls past (mobile) */
  const tb = $('#tb-title');
  if (tb) {
    const h1 = $('.view-head h1');
    const past = h1 ? h1.getBoundingClientRect().bottom < 58 : y > 150;
    tb.classList.toggle('show', !!past && !navAway);
  }
}
window.addEventListener('scroll', () => {
  if (scrollRaf) return;
  scrollRaf = requestAnimationFrame(() => {
    scrollRaf = 0;
    scrollChrome(window.scrollY || document.documentElement.scrollTop || 0);
  });
}, { passive: true });

let sparkN = 0;
function sparkSVG(vals, opts) {
  const id = ++sparkN, W = 300, H = 90, p = 8, mx = Math.max.apply(null, vals.concat([0.0001])), mn = Math.min.apply(null, vals.concat([0]));
  const pts = vals.map((v, i) => [p + i * (W - 2 * p) / Math.max(1, vals.length - 1), H - p - ((v - mn) / ((mx - mn) || 1)) * (H - 2 * p)]);
  let d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i - 1] || pts[i], b = pts[i], c = pts[i + 1], e = pts[i + 2] || c;
    d += ' C' + (b[0] + (c[0] - a[0]) / 6).toFixed(1) + ' ' + (b[1] + (c[1] - a[1]) / 6).toFixed(1) + ',' + (c[0] - (e[0] - b[0]) / 6).toFixed(1) + ' ' + (c[1] - (e[1] - b[1]) / 6).toFixed(1) + ',' + c[0].toFixed(1) + ' ' + c[1].toFixed(1);
  }
  const l = pts[pts.length - 1];

    '<path class="ln" pathLength="100" d="' + d + '" style="stroke:' + col + '"/>' +

/* ---------- shared data bag, computed once per Home render ---------- */
function homeCtx() {
  const T = todayISO(), now = nowHM(), blocks = blocksForDate(T);
  const done = blocks.filter(b => blockDoneOn(b, T)).length;
  const pct = blocks.length ? Math.round(done / blocks.length * 100) : 0;
  const live = liveArr(state.deadlines).filter(d => d.status !== 'pending' && d.status !== 'done');
  const wk = live.filter(d => { const x = diffDays(d.due, T); return x >= 0 && x <= 7; }).length;
  const st = statsFor(T);
  const mon = addDays(T, -mondayIndex());
  const wv = DAY_SHORT.map((_, k) => { const iso = addDays(mon, k); return { iso, v: iso === T ? done : statsFor(iso).blocksDone, d: DAY_SHORT[k][0] + DAY_SHORT[k].slice(1).toLowerCase() }; });
  const goalN = Math.max(1, +state.profile.studyHours || 3);
  const noData = wv.every(x => x.v === 0);
  const wmax = Math.max(1, goalN, Math.max.apply(null, wv.map(x => x.v)));
  const taskList = liveArr(state.tasks).slice().sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0));
  const nb = blocks.find(b => !blockDoneOn(b, T) && b.end > now);
  const dlSorted = live.slice().sort((a, b) => String(a.due).localeCompare(String(b.due)));
  const sv = []; for (let k = 13; k >= 0; k--) { const iso = addDays(T, -k), s = state.dayStats[iso]; sv.push(k === 0 ? pct / 100 : (s && s.blocksTotal ? s.blocksDone / s.blocksTotal : 0)); }
  const streak = currentStreak();
  const fr = Math.max(0, Pomo.remaining), fpct = +(100 * fr / Pomo.total()).toFixed(1);
  const sess = Math.floor(st.focusMinutes / Math.max(1, Pomo.workMin));
  const shownB = TL_ALL ? blocks : blocks.filter(b => inDay(b.start));
  const hiddenN = blocks.length - shownB.length;
  const dn = new Date(), y = dn.getFullYear(), m = dn.getMonth();
  const lead = mondayIndex(new Date(y, m, 1)), nd = new Date(y, m + 1, 0).getDate();

}

/* ---------- card registry: { id, title, render(size), defaultSize, allowedSizes } ---------- */
const CARDS = [
  { id: 'progress',  title: 'Today’s progress', defaultSize: 'M',  allowedSizes: ['S', 'M', 'L'],        render: cardProgress },
  { id: 'weekly',    title: 'Weekly activity',  defaultSize: 'XL', allowedSizes: ['M', 'L', 'XL'],      render: cardWeekly },
  { id: 'focus',     title: 'Focus',            defaultSize: 'M',  allowedSizes: ['S', 'M', 'L'],       render: cardFocus },
  { id: 'tasks',     title: 'Today’s tasks',    defaultSize: 'M',  allowedSizes: ['S', 'M', 'L', 'XL'], render: cardTasks },
  { id: 'upnext',    title: 'Up next',          defaultSize: 'M',  allowedSizes: ['S', 'M', 'L', 'XL'], render: cardUpnext },
  { id: 'deadlines', title: 'Deadlines',        defaultSize: 'L',  allowedSizes: ['S', 'M', 'L', 'XL'], render: cardDeadlines },
  { id: 'streak',    title: 'Streak',           defaultSize: 'L',  allowedSizes: ['S', 'M', 'L', 'XL'], render: cardStreak },
  { id: 'quick',     title: 'Quick access',     defaultSize: 'L',  allowedSizes: ['S', 'M', 'L', 'XL'], render: cardQuick },
  { id: 'health',    title: 'Health',           defaultSize: 'L',  allowedSizes: ['S', 'M', 'L', 'XL'], render: cardHealth },
  { id: 'calendar',  title: 'Calendar',         defaultSize: 'M',  allowedSizes: ['S', 'M', 'L', 'XL'], render: cardCalendar },
  { id: 'timeline',  title: 'Today’s timeline', defaultSize: 'XL', allowedSizes: ['S', 'M', 'L', 'XL'], render: cardTimeline },
];
const CARD_IDS = CARDS.map(c => c.id);
const PRESETS = {
  minimal:    { order: ['progress', 'tasks', 'upnext', 'focus'], size: { progress: 'L', tasks: 'L', upnext: 'L', focus: 'L' }, hidden: ['weekly', 'deadlines', 'streak', 'quick', 'health', 'calendar', 'timeline'] },
  balanced:   { order: ['progress', 'weekly', 'focus', 'tasks', 'upnext', 'deadlines', 'calendar', 'timeline'], size: { progress: 'M', weekly: 'XL', focus: 'M', tasks: 'M', upnext: 'M', deadlines: 'L', calendar: 'L', timeline: 'L' }, hidden: ['streak', 'quick', 'health'] },
  everything: { order: CARD_IDS.slice(), hidden: [] },
};
function cardDef(id) { for (let k = 0; k < CARDS.length; k++) if (CARDS[k].id === id) return CARDS[k]; return null; }

/* ---------- layout state helpers (missing ids → defaults, unknown ids dropped) ---------- */
function effectiveOrder() {
  const L = state.layout || {};
  let order = (Array.isArray(L.order) ? L.order.slice() : []).filter(id => CARD_IDS.indexOf(id) >= 0);
  const missing = CARD_IDS.filter(id => order.indexOf(id) < 0);
  if (missing.length) {
    /* keep a trailing calendar/timeline pair last so the rail survives partial saves */
    const tail = [];
    while (order.length && (order[order.length - 1] === 'calendar' || order[order.length - 1] === 'timeline')) tail.unshift(order.pop());
    order = order.concat(missing, tail);
  }
  return order;
}
function hiddenIds() {
  const L = state.layout || {};
  return (Array.isArray(L.hidden) ? L.hidden : []).filter(id => CARD_IDS.indexOf(id) >= 0);
}
function cardSize(id) {
  const def = cardDef(id);
  const s = state.layout && state.layout.size ? state.layout.size[id] : null;
  return def && def.allowedSizes.indexOf(s) >= 0 ? s : def ? def.defaultSize : 'M';
}
function visOrder() { return effectiveOrder().filter(id => hiddenIds().indexOf(id) < 0); }
/* Desktop rail: calendar/timeline stay in the right-hand column until the user moves them. */
function railIds() {
  if (EDIT) return [];
  const vis = visOrder();
  const tail = [];
  for (let k = vis.length - 1; k >= 0; k--) {
    if (vis[k] === 'calendar' || vis[k] === 'timeline') tail.unshift(vis[k]); else break;
  }
  return tail;
}
function materializeOrder() { state.layout.order = effectiveOrder(); }

/* ---------- layout mutations (each persists immediately) ---------- */
function moveCard(id, dir) {
  const def = cardDef(id); if (!def) return;
  const vis = visOrder();
  const i = vis.indexOf(id);
  if (i < 0) return;
  const j = clamp(i + dir, 0, vis.length - 1);
  if (j === i) { liveSay(def.title + ' is already ' + (dir < 0 ? 'first' : 'last')); return; }
  const other = vis[j];
  materializeOrder();
  const order = state.layout.order;
  order.splice(order.indexOf(id), 1);
  const ni = order.indexOf(other);
  order.splice(dir < 0 ? ni : ni + 1, 0, id);
  Store.set();
  withFlip($('#view'), renderView);
  const h = $('.card[data-card="' + id + '"] [data-role="drag"]');
  if (h) h.focus({ preventScroll: true });
  liveSay(def.title + ' moved to position ' + (j + 1));
}
function placeCardBefore(id, beforeId) {
  materializeOrder();
  const order = state.layout.order;
  order.splice(order.indexOf(id), 1);
  if (beforeId && order.indexOf(beforeId) >= 0) {
    order.splice(order.indexOf(beforeId), 0, id);
  } else {
    const hid = hiddenIds();
    let k = order.length - 1;
    while (k >= 0 && hid.indexOf(order[k]) >= 0) k--;
    order.splice(k + 1, 0, id);
  }
  Store.set();
}
function setCardSize(id, sz) {
  const def = cardDef(id);
  if (!def || def.allowedSizes.indexOf(sz) < 0) return;
  if (!state.layout.size || typeof state.layout.size !== 'object') state.layout.size = {};
  state.layout.size[id] = sz;
  Store.set();
  withFlip($('#view'), renderView);
  const el = $('.card[data-card="' + id + '"]');
  if (el && !prefersReduced()) { el.classList.add('xfade'); setTimeout(() => el.classList.remove('xfade'), 340); }
  const sb = $('.card[data-card="' + id + '"] [data-role="size"][data-sz="' + sz + '"]');
  if (sb) sb.focus({ preventScroll: true });
  liveSay(def.title + ' set to ' + SIZE_NAME[sz]);
}
function hideCard(id) {
  const def = cardDef(id); if (!def) return;
  const el = $('.card[data-card="' + id + '"]');
  const apply = () => {
    withFlip($('#view'), () => {
      state.layout.hidden = hiddenIds().filter(x => x !== id).concat([id]);
      Store.set();
      renderView();
    });
    toastAction('Hid “' + def.title + '”', 'Undo', () => showCard(id));
    liveSay(def.title + ' hidden. Undo is available in the toast.');
    if (EDIT) { const chip = $('.tray-chip[data-card="' + id + '"]'); if (chip) chip.focus({ preventScroll: true }); }
  };
  if (el && !prefersReduced()) { el.classList.add('hiding'); setTimeout(apply, 240); }
  else apply();
}
function showCard(id) {
  const def = cardDef(id); if (!def) return;
  state.layout.hidden = hiddenIds().filter(x => x !== id);
  Store.set();
  withFlip($('#view'), renderView);
  const el = $('.card[data-card="' + id + '"]');
  if (el && !prefersReduced()) { el.classList.add('show-in'); setTimeout(() => el.classList.remove('show-in'), 420); }
  liveSay(def.title + ' added back to Home');
  if (EDIT) { const h = $('.card[data-card="' + id + '"] [data-role="drag"]'); if (h) h.focus({ preventScroll: true }); }
}
function applyPreset(k) {
  const p = PRESETS[k];
  if (!p) return;
  state.layout.order = p.order.filter(id => CARD_IDS.indexOf(id) >= 0).slice();
  CARD_IDS.forEach(id => { if (state.layout.order.indexOf(id) < 0) state.layout.order.push(id); });
  state.layout.size = {};
  const ps = p.size || {};
  Object.keys(ps).forEach(id => { if (CARD_IDS.indexOf(id) >= 0) state.layout.size[id] = ps[id]; });
  state.layout.hidden = (p.hidden || []).filter(id => CARD_IDS.indexOf(id) >= 0);
  state.profile.preset = k;
  Store.set();
}
function resetLayout() {
  state.layout.order = [];
  state.layout.size = {};
  state.layout.hidden = [];
  Store.set();
  withFlip($('#view'), renderView);
  toast('Layout reset to defaults', 'info');
  liveSay('Layout reset to defaults');
}
function toggleEdit(force) {
  EDIT = typeof force === 'boolean' ? force : !EDIT;
  document.body.classList.toggle('customizing', EDIT);
  renderView();
  if (EDIT) {
    const b = $('.editbar [data-action="edit-done"]');
    if (b) b.focus({ preventScroll: true });
    liveSay('Customize mode on. Cards can be reordered, resized and hidden.');
  } else {
    const b = $('.cust');
    if (b) b.focus({ preventScroll: true });
    liveSay('Customize mode off');
  }
}

/* ---------- motion helpers (transform/opacity only) ---------- */
function flipEl(el, dx, dy) {
  if (!el || !el.isConnected) return;
  if (el.__flipT) { clearTimeout(el.__flipT); el.__flipT = 0; }
  el.style.transition = 'none';
  el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  requestAnimationFrame(() => {
    el.style.transition = 'transform .25s ease-out';
    el.style.transform = '';
    el.__flipT = setTimeout(() => { el.style.transition = ''; el.style.transform = ''; el.__flipT = 0; }, 300);
  });
}
function withFlip(root, mutate) {
  if (!root) { mutate(); return; }
  const cards = $$('.card', root).filter(el => el.isConnected);
  const before = cards.map(el => [el, el.getBoundingClientRect()]);
  mutate();
  if (prefersReduced()) return;
  before.forEach(pair => {
    const el = pair[0], r = pair[1];
    if (!el.isConnected) return;
    const n = el.getBoundingClientRect();
    if (Math.abs(r.left - n.left) < 1 && Math.abs(r.top - n.top) < 1) return;
    flipEl(el, r.left - n.left, r.top - n.top);
  });
}
function liveSay(msg) {
  let el = $('#bento-live');
  if (!el) {
    el = document.createElement('p');
    el.id = 'bento-live';
    el.className = 'sr-only';
    el.setAttribute('aria-live', 'polite');
    document.body.appendChild(el);
  }
  el.textContent = '';
  setTimeout(() => { el.textContent = msg; }, 30);
}
function toastAction(msg, actLabel, fn) {
  const r = $('#toasts');
  if (!r) { if (fn) setTimeout(fn, 0); return; }
  const el = document.createElement('div');
  el.className = 'toast info';
  const span = document.createElement('span');
  span.textContent = msg;
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 't-act';
  b.textContent = actLabel;
  b.addEventListener('click', () => { Haptics.select(b); fn(); el.remove(); });
  el.appendChild(span);
  el.appendChild(b);
  r.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 5200);
}

/* ---- default focus-mode label: current or next block, else "Deep work" ---- */

  const T = todayISO(), n = nowHM();
  const bs = blocksForDate(T).filter(b => !blockDoneOn(b, T) && b.end > n)
    .sort((a, b) => (a.start < b.start ? -1 : a.start > b.start ? 1 : 0));
  return bs.length ? bs[0].title : 'Deep work';
}
function fmHTML() {

  const chip = (k, name) => '<button type="button" class="fm-chip' + (Noise.channels[k] ? ' on' : '') + '" data-fmnoise="' + k + '" aria-pressed="' + (Noise.channels[k] ? 'true' : 'false') + '">' + name + '</button>';
  return '' +
    '<div class="fm-top fm-ui"><button type="button" class="fm-exit" data-fmact="exit">' + ICON.x + 'Exit</button></div>' +
    '<div class="fm-main">' +

const FM = {
  open: false, fs: false, label: '', done: false, doneMode: 'work',
  idleT: 0, lastMin: -1, volSig: null, opener: null,

  enter() {
    if (this.open) return;
    if (PAL.on) PAL.hide();
    this.label = fmDefaultLabel();
    this.done = false; this.volSig = null; this.lastMin = -1;
    this.opener = document.activeElement;
    let el = $('#fm');
    if (!el) {
      el = document.createElement('div');
      el.id = 'fm'; el.className = 'fm';
      el.setAttribute('role', 'dialog');
      el.setAttribute('aria-modal', 'true');
      el.setAttribute('aria-label', 'Focus mode');
      document.body.appendChild(el);
      el.addEventListener('click', e => this.onClick(e));
      el.addEventListener('input', e => this.onInput(e));
      ['pointermove', 'pointerdown', 'wheel', 'touchstart'].forEach(ev =>
        el.addEventListener(ev, () => this.wake(), { passive: true }));
    }
    el.innerHTML = fmHTML();
    el.hidden = false;
    this.open = true;
    closeChip();
    /* Fullscreen API when the browser allows it; the fixed overlay is the fallback */
    this.fs = !!document.fullscreenElement;
    try {
      const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      if (p && p.then) p.then(() => { this.fs = !!document.fullscreenElement; }).catch(() => {});
    } catch (err) {}
    /* defaults from the profile: preferred noise starts if nothing is playing */
    const pref = state.profile.noise;
    if (pref && pref !== 'none' && !Object.keys(Noise.channels).length) Noise.startChannel(pref);
    const m = $('#fm-master');
    if (m) paintRange(m);
    const s = $('#fm-start');
    if (s) s.focus({ preventScroll: true });
    this.wake();
    this.paint();
    liveSay('Focus mode on. Escape exits.');
  },

  close() {
    if (!this.open) return;
    this.open = false;
    const el = $('#fm');
    if (el) { el.hidden = true; el.classList.remove('idle'); }
    clearTimeout(this.idleT);
    if (document.fullscreenElement) { try { document.exitFullscreen().catch(() => {}); } catch (err) {} }
    if (this.opener && this.opener.focus) { try { this.opener.focus({ preventScroll: true }); } catch (err) {} }
    this.fs = false;
    /* the timer and any playing noise keep running after exit */
  },

  /* 500 ms heartbeat from globalTick — the engine keeps the clock, we only paint */
  tick() { this.paint(); },

  paint() {
    if (!this.open) return;
    const el = $('#fm'); if (!el) return;
    const rem = Math.max(0, Pomo.remaining), tot = Math.max(1, Pomo.total());
    const t = $('#fm-time');
    if (t) t.textContent = String(Math.floor(rem / 60)).padStart(2, '0') + ':' + String(Math.floor(rem % 60)).padStart(2, '0');
    const arc = $('#fm-arc');
    if (arc) arc.style.strokeDashoffset = (653.45 * (1 - rem / tot)).toFixed(1);
    const md = $('#fm-mode');
    if (md) md.textContent = Pomo.mode === 'work' ? 'Focus' : 'Break';
    const sb = $('#fm-start');
    if (sb) sb.textContent = Pomo.running ? 'Pause' : 'Start';
    $$('.fm-chip[data-fmnoise]', el).forEach(c => {
      const on = !!Noise.channels[c.dataset.fmnoise];
      c.classList.toggle('on', on);
      c.setAttribute('aria-pressed', String(on));
    });
    const sl = $('.fm-chip[data-fmact="sleep"]', el);
    if (sl) {
      const left = Noise.sleepEnd ? Math.max(0, Math.ceil((Noise.sleepEnd - Date.now()) / 60000)) : 0;
      sl.textContent = Noise.sleepEnd ? 'Sleep · ' + left + ' min' : 'Sleep · off';
      sl.classList.toggle('on', !!Noise.sleepEnd);
    }
    this.paintVols();
    /* aria-live: announce only when the whole minutes change (never over the

    const min = Math.ceil(rem / 60);
    if (min !== this.lastMin) {
      this.lastMin = min;

      if (live && !this.done) live.textContent = Pomo.mode === 'work' ? min + ' min left in focus' : min + ' min left in break';

    const keys = ['white', 'pink', 'brown'].filter(k => Noise.channels[k]);

    box.innerHTML = keys.map(k =>
      '<label class="fm-volrow"><span>' + k.charAt(0).toUpperCase() + k.slice(1) + '</span>' +
      '<input type="range" min="0" max="100" value="' + (state.settings.sound[k] != null ? state.settings.sound[k] : 50) + '" data-fmvol="' + k + '" aria-label="' + k + ' noise volume"></label>').join('');

  },

  wake() {
    if (!this.open) return;

    if (!f.length) return;

    else if (act === 'skip') { Pomo.skip(); this.paint(); }

  },
};

/* ---- command palette helpers ---- */
function fuzzy(q, t) {
  q = String(q || '').toLowerCase();
  t = String(t || '').toLowerCase();
  if (!q) return 0;
  let qi = 0, score = 0, run = 0;
  for (let i = 0; i < t.length && qi < q.length; i++) {
    if (t[i] === q[qi]) {
      qi++; run++;
      score += 1 + run + ((i === 0 || /[\s/·.\-(]/.test(t[i - 1])) ? 3 : 0);
    } else run = 0;
  }
  return qi === q.length ? score - t.length * 0.01 : -1;
}

  build() {

      .filter(x => x.s >= 0).sort((a, b) => b.s - a.s);

      ? this.items.map((it, i) => it.hdr

          '<span class="pal-ic">' + (ICON[it.icon] || '') + '</span>' +
          '<span class="pal-txt">' + esc(it.label) + (it.sub ? '<small>' + esc(it.sub) + '</small>' : '') + '</span>' +
          '<span class="pal-gr">' + esc(it.group || '') + '</span>' +
          (it.keys && it.keys.length ? '<span class="pal-keys">' + it.keys.map(k => '<kbd>' + esc(k) + '</kbd>').join('') + '</span>' : '') +

    this.sel = i;
    this.syncSel();
  },

  run(i) {
    const it = this.items[i];
    if (!it || it.hdr) return;
    this.hide();
    if (this.commands.indexOf(it) >= 0) pushRecentCmd(it.id);
    if (it.run) it.run();
  },

/* ---- keyboard: palette (capture, registered first so it wins over focus mode) ---- */
document.addEventListener('keydown', e => {
  if (!PAL.on) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); e.stopPropagation(); PAL.hide(); return; }
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); PAL.hide(); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); e.stopPropagation(); PAL.move(e.key === 'ArrowDown' ? 1 : -1); return; }
  if (e.key === 'Enter') {
    if (e.target.closest && e.target.closest('.pal-row')) { e.stopPropagation(); return; }   /* focused row clicks itself */
    e.preventDefault(); e.stopPropagation(); PAL.runSel(); return;
  }
  if (e.key === 'Tab') { e.preventDefault(); e.stopPropagation(); return; }   /* keep focus in the query box */
}, true);

/* ---- keyboard: focus mode (capture; palette on top when both are open) ---- */
document.addEventListener('keydown', e => {
  if (!FM.open || PAL.on) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') return;   /* let the palette opener through */
  FM.wake();
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); FM.close(); return; }
  if (e.key === 'Tab') { e.preventDefault(); e.stopPropagation(); FM.trap(e.shiftKey); return; }
  if (e.target.closest && e.target.closest('.fm input, .fm textarea, .fm select')) return;   /* typing in the label */
  e.stopPropagation();                                    /* dialog open: nothing else reacts */
  if (e.key === ' ') {
    const ae = document.activeElement;
    if (!(ae && ae.closest && ae.closest('.fm button, .fm [role="button"]'))) {   /* space activates a focused button */
      e.preventDefault();
      if (!FM.done) { Pomo.toggle(); FM.paint(); }
    }
  }
}, true);

      openBlockModal(null, mondayIndex(fromISO(CAL.mode === 'month' ? todayISO() : CAL.anchor)));
  } : null;

  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const lk = e.key.toLowerCase();
  const chord = CHORD;
  if (e.shiftKey && e.key === 'N') { closeChip(); return; }   /* Shift+N is its own shortcut: new block now */
  if (lk === chord) { e.preventDefault(); e.stopPropagation(); closeChip(); chordChip(lk); return; }
  const hit = chord === 'g'
    ? { h: 'today', p: 'timetable', t: 'todo', n: 'notes', f: 'focus', i: 'stats' }[lk]
    : (chord === 'n' ? { t: 'task', b: 'block', o: 'note' }[lk] : null);
  closeChip();
  if (!hit) return;                      /* miss: let the key flow on to the view handlers */
  e.preventDefault();
  e.stopPropagation();

/* ════════════════════════════════════════════════════════════════
   21.95 CHUNK E — feel + haptics
   Haptics module · rAF spring solver · swipe-to-act rows ·
   draggable sheets/popovers · ring inertia · card press · tap hook.
   Physics all run on transform/opacity and switch off entirely under
   prefers-reduced-motion. No data shapes touched beyond
   profile.haptics = { on, level, sound }.

/* ---- haptics: one module, everything calls it ---- */
function hapticsCfg() {
  try {
    const h = (state && state.profile && state.profile.haptics) || {};
    return { on: h.on !== false, level: ['light', 'medium', 'strong'].indexOf(h.level) >= 0 ? h.level : 'medium', sound: !!h.sound };
  } catch (e) { return { on: true, level: 'medium', sound: false }; }
}
const Haptics = (function () {
  let adapter = null;
  const PATTERNS = { tap: [8], select: [12], success: [10, 40, 10], warning: [20, 50], error: [30, 40, 30, 40, 30], impact: [14] };
  const LEVELS = { light: 0.55, medium: 1, strong: 1.6 };
  /* desktop Chrome exposes navigator.vibrate as a no-op that still reports success,
     so only trust it on touch/mobile profiles — everywhere else use the visual pulse */
  const CAN_BUZZ = (function () {
    try {
      return typeof navigator === 'object' && navigator && typeof navigator.vibrate === 'function' &&

    } catch (e) { return false; }
  })();
  function vibrate(pattern, mult) {
    try {
      if (!CAN_BUZZ) return false;
      return !!navigator.vibrate(pattern.map(function (ms) { return Math.max(1, Math.round(ms * mult)); }));
    } catch (e) { return false; }
  }
  function softClick() {           /* optional; only rides an already-running context */
    try {
      const ctx = Noise.ctx;
      if (!ctx || ctx.state !== 'running') return;
      const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 1850;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.028, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.032);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.04);
    } catch (e) {}
  }
  function visualPulse(el) {       /* desktop fallback: 1.5 % scale flick */

    } catch (e) {}
  }
  function emit(kind, el) {
    try {
      const cfg = hapticsCfg();
      if (!cfg.on) return;
      const pattern = PATTERNS[kind] || PATTERNS.tap;
      const mult = LEVELS[cfg.level] || 1;
      let delivered = false;
      if (adapter && typeof adapter[kind] === 'function') { try { adapter[kind](); delivered = true; } catch (e) {} }
      if (!delivered) delivered = vibrate(pattern, mult);

  }
  return {

    select: el => emit('select', el),

    warning: el => emit('warning', el),
    error: el => emit('error', el),
    impact: el => emit('impact', el),
    setAdapter(a) { adapter = (a && typeof a === 'object') ? a : null; },
    config: hapticsCfg

})();

/* ---- tiny spring solver (stiffness / damping / mass / velocity, rAF) ---- */
const Spring = (function () {
  const live = new Set();
  let raf = 0;
  function loop(now) {
    raf = 0;
    live.forEach(function (s) {
      let dt = (now - s.t) / 1000;
      s.t = now;
      if (!(dt > 0) || dt > 0.05) dt = 0.016;
      const F = -s.k * (s.x - s.to) - s.c * s.v;
      s.v += (F / s.m) * dt;
      s.x += s.v * dt;
      const eps = s.eps != null ? s.eps : Math.max(0.05, Math.abs(s.to) * 0.001);
      if (Math.abs(s.x - s.to) < eps && Math.abs(s.v) < 3) {
        s.x = s.to;
        s.step(s.to);
        live.delete(s);
        if (s.done) { try { s.done(); } catch (e) {} }
        return;
      }
      s.step(s.x);
    });
    if (live.size) raf = requestAnimationFrame(loop);
  }
  return {
    to(o) {
      const s = {
        x: o.from || 0, to: o.to || 0, v: o.velocity || 0,
        k: o.k || 260, c: o.c || 22, m: o.m || 1, t: performance.now(),
        eps: o.eps != null ? o.eps : null,
        step: typeof o.step === 'function' ? o.step : function () {},
        done: typeof o.done === 'function' ? o.done : null
      };
      if (prefersReduced()) { s.step(s.to); if (s.done) s.done(); return { cancel: function () {} }; }
      live.add(s);
      if (!raf) raf = requestAnimationFrame(loop);
      return { cancel: function () { live.delete(s); if (!live.size && raf) { cancelAnimationFrame(raf); raf = 0; } } };
    }
  };
})();

/* ---- pomodoro ring: settles with slight inertia on start/stop ---- */
function ringKick() {
  if (prefersReduced()) return;
  const arc = $('#pomo-arc');
  const el = arc ? arc.ownerSVGElement : $('.fm-ringwrap');
  if (!el || !el.isConnected) return;
  if (el._rk) el._rk.cancel();
  el._rk = Spring.to({
    from: 1.035, to: 1, k: 300, c: 14, eps: 0.0008,
    step: v => { el.style.scale = v.toFixed(4); },
    done: () => { el.style.scale = ''; el._rk = null; }
  });
}

/* ---- generic tap haptic (buttons without a more specific trigger) ---- */
(function () {
  const SKIP = '[data-action="nav-go"],[data-action="task-toggle"],[data-action="blk-toggle"],[data-action="theme-set"],[data-action="todo-filter"],[data-action="noise-home"],[data-action="pomo-start"],[data-action^="haptic"],[data-fmnoise],[data-fmact="start"],.switch,.t-act,[data-calpop="done"],#view > .task,.trow,.tli,.cal-blk';
  document.addEventListener('pointerdown', function (e) {
    if (e.button !== undefined && e.button !== 0) return;
    const t = e.target;
    if (!t || !t.closest) return;
    const b = t.closest('button, [role="button"], [role="switch"], [role="tab"], [role="menuitem"], [role="option"]');
    if (!b || b.closest(SKIP)) return;
    Haptics.tap(b);
  }, true);
})();

/* ---- cards: press feedback only when the card body itself is pressed ---- */
document.addEventListener('pointerdown', function (e) {
  if (e.button !== undefined && e.button !== 0) return;
  const t = e.target;
  if (!t || !t.closest) return;
  const card = t.closest('.bento > .card');
  if (!card || card.classList.contains('drag-ghost')) return;
  if (t.closest('button, input, select, textarea, a, label, [data-role], [contenteditable]')) return;
  card.classList.add('press-on');
  const off = function () {
    card.classList.remove('press-on');
    document.removeEventListener('pointerup', off);
    document.removeEventListener('pointercancel', off);
  };
  document.addEventListener('pointerup', off);
  document.addEventListener('pointercancel', off);
}, true);

/* ---- swipe-to-act: right = complete (green), left = delete (red) ----
   Applies to Tasks rows, Home task rows and Today timeline rows.
   Velocity-aware commit, spring snap-back, undo toast on delete. */
const Swipe = { row: null, pid: null, x0: 0, y0: 0, dx: 0, th: 64, w: 0, engaged: false, samples: [], rv: null };
function rowIdOf(row) {
  const el = row.dataset.id ? row : (row.querySelector('[data-id]'));
  return el ? el.dataset.id : null;
}
function swipeBlockClick(e) { e.preventDefault(); e.stopPropagation(); }
function swipeReveal(row) {
  let rv = $('.swipe-rv', row);
  if (!rv) {
    rv = document.createElement('span');
    rv.className = 'swipe-rv';
    rv.innerHTML = '<span class="sv-r">' + ICON.check + '</span><span class="sv-l">' + ICON.trash + '</span>';
    row.insertBefore(rv, row.firstChild);
  }
  Swipe.rv = rv;
}
function swipeDown(e) {
  if (prefersReduced()) return;
  if (e.button !== undefined && e.button !== 0) return;
  if (FM.open || PAL.on || P.open || modalOpen() || Drag.on || Rez.on || CALDRAG) return;
  const t = e.target;
  if (!t || !t.closest || t.closest('input, textarea, select, [contenteditable]')) return;
  const row = t.closest('#view > .task, .trow, .tli');
  if (!row || !rowIdOf(row)) return;
  Swipe.row = row; Swipe.pid = e.pointerId;
  Swipe.x0 = e.clientX; Swipe.y0 = e.clientY;
  Swipe.engaged = false; Swipe.dx = 0; Swipe.rv = null;
  Swipe.samples = [{ x: e.clientX, t: performance.now() }];
  document.addEventListener('pointermove', swipeMove);
  document.addEventListener('pointerup', swipeUp);
  document.addEventListener('pointercancel', swipeCancel);
}
function swipeCleanup() {
  document.removeEventListener('pointermove', swipeMove);
  document.removeEventListener('pointerup', swipeUp);
  document.removeEventListener('pointercancel', swipeCancel);
  const row = Swipe.row;
  Swipe.row = null; Swipe.pid = null; Swipe.rv = null;
  return row;
}
function swipeMove(e) {
  const S = Swipe;
  if (!S.row || e.pointerId !== S.pid) return;
  const x = e.clientX, y = e.clientY, t = performance.now();
  const dx = x - S.x0, dy = y - S.y0;
  if (!S.engaged) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { const row = swipeCleanup(); if (row) springRow(row, 0, 0); return; }
    if (Math.abs(dx) < 9 || Math.abs(dx) < Math.abs(dy) + 4) return;
    S.engaged = true;
    S.w = S.row.offsetWidth;
    S.th = clamp(S.w * 0.3, 64, 120);   /* 30 % of the row, capped so wide desktop rows stay swipeable */
    S.row.classList.add('swiping');
    if (S.row._spring) { S.row._spring.cancel(); S.row._spring = null; }
    try { S.row.setPointerCapture(S.pid); } catch (err) {}
    swipeReveal(S.row);
    S.row.addEventListener('click', swipeBlockClick, true);
    Haptics.impact();
  }
  S.samples.push({ x: x, t: t });
  if (S.samples.length > 12) S.samples.shift();
  S.dx = clamp(dx, -S.w * 0.92, S.w * 0.92);
  S.row.style.transform = 'translateX(' + S.dx.toFixed(1) + 'px)';
  if (S.rv) {
    const right = S.dx >= 0;
    S.rv.classList.toggle('right', right);
    S.rv.classList.toggle('left', !right);
    S.rv.style.opacity = Math.min(1, Math.abs(S.dx) / S.th).toFixed(2);
  }
}
function swipeVel() {
  const s = Swipe.samples;
  if (s.length < 2) return 0;
  const b = s[s.length - 1];
  let a = s[0];
  for (let i = s.length - 2; i >= 0; i--) { a = s[i]; if (b.t - s[i].t >= 16) break; }
  const dt = b.t - a.t;
  return dt > 0 ? (b.x - a.x) / dt : 0;
}
function springRow(row, from, vMs) {
  if (!row || !row.isConnected) return;
  if (row._spring) row._spring.cancel();
  row.style.transition = 'none';
  row._spring = Spring.to({
    from: from, to: 0,
    velocity: clamp((vMs || 0) * 600, -1800, 1800),
    k: 300, c: 24,
    step: x => { row.style.transform = 'translateX(' + x.toFixed(1) + 'px)'; },
    done: function () { row._spring = null; swipeRestore(row); }
  });
}
function swipeRestore(row) {
  if (!row || !row.isConnected) return;
  row.classList.remove('swiping');
  row.style.transition = '';
  row.style.transform = '';
  const rv = $('.swipe-rv', row);
  if (rv) { rv.className = 'swipe-rv'; rv.style.opacity = ''; }
  setTimeout(function () { if (row.isConnected) row.removeEventListener('click', swipeBlockClick, true); }, 80);
}
function swipeUp(e) {
  const S = Swipe;
  if (!S.row || (e.pointerId !== undefined && e.pointerId !== S.pid)) return;
  const row = S.row, engaged = S.engaged, dx = S.dx, th = S.th || 64;
  const v = engaged ? swipeVel() : 0;
  const goRight = engaged && (dx > th || (dx > 14 && v > 0.55));
  const goLeft = engaged && (-dx > th || (dx < -14 && v < -0.55));
  swipeCleanup();
  if (!engaged || !row || !row.isConnected) return;
  if (goRight) { swipeCommit(row, true, dx, v); return; }
  if (goLeft) { swipeCommit(row, false, dx, v); return; }
  Haptics.tap();
  springRow(row, dx, v);
}
function swipeCancel() {
  const S = Swipe;
  const row = S.row, engaged = S.engaged, dx = S.dx;
  swipeCleanup();
  if (engaged && row && row.isConnected) springRow(row, dx, 0);
}
function swipeCommit(row, toRight, dx, v) {
  const id = rowIdOf(row);
  if (toRight) {
    /* complete: state flips now, the row springs home, the fresh row celebrates */
    Haptics.success();
    let did = false;
    const t = state.tasks.find(function (x) { return x.id === id; });
    if (t) {
      if (!t.done) {
        t.done = true;
        touchRec(t);
        lastTaskToggled = id;
        ensureStats(todayISO()).tasksDone += 1;
        Store.set();
        did = true;
      }
    } else {
      const b = state.blocks.find(function (x) { return x.id === id; });
      if (b && !blockDoneOn(b, todayISO())) {
        toggleBlockDone(b, todayISO());
        lastToggled = id;
        recomputeDayStats(todayISO());
        Store.set();
        did = true;
      }
    }
    if (did) setTimeout(function () { if (route === 'todo' || route === 'today') renderView(); }, 330);
    springRow(row, dx, v);
  } else {
    /* delete: fly out, then remove with an undo toast */
    Haptics.warning();
    if (row._spring) { row._spring.cancel(); row._spring = null; }
    row.style.transition = 'transform .2s var(--ease-out),opacity .2s var(--ease-out)';
    row.style.transform = 'translateX(' + (-row.offsetWidth - 40) + 'px)';
    row.style.opacity = '0';
    setTimeout(function () {
      const t = state.tasks.find(function (x) { return x.id === id; });
      if (t) {
        softDelete(state.tasks, id);
        Store.set(); renderView();
        toastAction('Task deleted', 'Undo', function () {
          softUndelete(t);
          Store.set();
          if (route === 'todo' || route === 'today') renderView();
        });
        return;
      }
      const b = state.blocks.find(function (x) { return x.id === id; });
      if (b) {
        softDelete(state.blocks, id);
        recomputeDayStats(todayISO()); Store.set(); renderView();
        toastAction('Block deleted', 'Undo', function () {
          softUndelete(b);
          recomputeDayStats(todayISO()); Store.set();
          if (route === 'today' || route === 'timetable') renderView();
        });
      }
    }, 210);
  }
}
document.addEventListener('pointerdown', swipeDown);

/* ---- draggable dismiss for bottom sheets (mobile modal) + popovers ---- */
const Sheet = { el: null, mode: '', pid: null, y0: 0, y: 0, samples: [] };
function sheetResist(dy) {
  if (dy <= 0) return dy * 0.3;                       /* rubber-band upward */
  return 150 * (1 - 1 / (dy / 150 + 1));              /* asymptotic downward */
}
function sheetDown(e) {
  if (prefersReduced()) return;
  if (e.button !== undefined && e.button !== 0) return;
  const t = e.target;
  if (!t || !t.closest) return;
  const pop = t.closest('.calpop');
  const box = pop ? null : t.closest('.modal-box');
  const el = pop || box;
  if (!el) return;
  if (t.closest('button, input, select, textarea, a, label, [data-action], [data-calpop], [data-seg]')) return;
  if (box) {
    if (window.innerWidth > 640) return;              /* sheet layout is mobile-only */
    const r = box.getBoundingClientRect();
    if (e.clientY - r.top > 44) return;               /* only the grip zone starts the drag */
  }
  Sheet.el = el; Sheet.mode = pop ? 'pop' : 'box'; Sheet.pid = e.pointerId;
  Sheet.y0 = e.clientY; Sheet.y = 0;
  Sheet.samples = [{ y: e.clientY, t: performance.now() }];
  el.classList.add('sheet-drag');
  try { el.setPointerCapture(e.pointerId); } catch (err) {}
  document.addEventListener('pointermove', sheetMove);
  document.addEventListener('pointerup', sheetUp);
  document.addEventListener('pointercancel', sheetCancel);
}
function sheetMove(e) {
  if (!Sheet.el || e.pointerId !== Sheet.pid) return;
  Sheet.samples.push({ y: e.clientY, t: performance.now() });
  if (Sheet.samples.length > 6) Sheet.samples.shift();
  Sheet.y = sheetResist(e.clientY - Sheet.y0);
  Sheet.el.style.transform = 'translateY(' + Sheet.y.toFixed(1) + 'px)';
}
function sheetVel() {
  const s = Sheet.samples;
  if (s.length < 2) return 0;
  const a = s[0], b = s[s.length - 1];
  const dt = b.t - a.t;
  return dt > 0 ? (b.y - a.y) / dt : 0;
}
function sheetCleanup() {
  document.removeEventListener('pointermove', sheetMove);
  document.removeEventListener('pointerup', sheetUp);
  document.removeEventListener('pointercancel', sheetCancel);
  const el = Sheet.el;
  Sheet.el = null; Sheet.pid = null;
  return el;
}
function sheetUp(e) {
  if (!Sheet.el || (e.pointerId !== undefined && e.pointerId !== Sheet.pid)) return;
  const el = Sheet.el, y = Sheet.y, v = sheetVel();
  sheetCleanup();
  if (!el || !el.isConnected) return;
  el.classList.remove('sheet-drag');
  if (y > 84 || v > 0.6) {                            /* dismiss */
    Haptics.select();
    el.style.transition = 'transform .2s ease-in,opacity .2s ease-in';
    el.style.transform = 'translateY(' + (window.innerHeight + 40) + 'px)';
    el.style.opacity = '0';
    setTimeout(function () {
      if (Sheet.mode === 'pop') closeCalPop();
      else { closeModal(); el.style.transform = ''; el.style.opacity = ''; el.style.transition = ''; }
    }, 200);
    return;
  }
  /* spring back home with release velocity */
  if (el._sh) el._sh.cancel();
  el.style.transition = 'none';
  el._sh = Spring.to({
    from: y, to: 0, velocity: clamp(v * 600, -1800, 1800), k: 300, c: 26,
    step: x => { el.style.transform = 'translateY(' + x.toFixed(1) + 'px)'; },
    done: function () { el._sh = null; el.style.transform = ''; }
  });
}
function sheetCancel() {
  const el = Sheet.el, y = Sheet.y;
  sheetCleanup();
  if (el && el.isConnected) {
    el.classList.remove('sheet-drag');
    el.style.transform = '';
  }
}
document.addEventListener('pointerdown', sheetDown);

/* ---------------- 22. INIT ---------------- */
(function init() {
  state = Store.load();
  Pomo.remaining = Pomo.workMin * 60;
  applyTheme();
  buildNav();
  setRoute('today');
  setInterval(globalTick, 500);
  /* never lose a debounced write when the tab goes away */
  window.addEventListener('pagehide', function () { try { Store.flush(); } catch (e) {} });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') { try { Store.flush(); } catch (e) {} } });
  if (!state.profile.onboarded) Onb.open();
})();
</script>
